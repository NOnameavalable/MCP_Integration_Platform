name: Checkstyle

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check
